name: Label Pull Requests

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Label PR
        uses: actions/labeler@v4
        continue-on-error: true
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
